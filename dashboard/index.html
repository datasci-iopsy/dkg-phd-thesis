<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESM Study Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header p {
      font-size: 0.8125rem;
      color: #666;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }

    .card .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 0.5rem;
    }

    .card .value {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .card .sub {
      font-size: 0.8125rem;
      color: #666;
      margin-top: 0.375rem;
    }

    .card.accent .value { color: #2563eb; }

    .section-title {
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 0.75rem;
    }

    .waves {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .wave-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
    }

    .wave-card .wave-label {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .bar-track {
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .bar-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .wave-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.8125rem;
      color: #555;
    }

    .wave-stats .rate {
      font-weight: 600;
      color: #1a1a1a;
    }

    .meta {
      font-size: 0.75rem;
      color: #999;
      text-align: right;
    }

    .error-msg {
      background: #fff8f0;
      border: 1px solid #f0c080;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      color: #7a4800;
      margin-bottom: 1.5rem;
    }

    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ESM Study Dashboard</h1>
    <p>Within-person fluctuation in burnout, need frustration, and turnover intentions</p>
  </header>

  <main>
    <div id="error-banner" class="error-msg" style="display:none"></div>

    <div class="grid" id="summary-cards">
      <div class="card accent">
        <div class="label">Enrolled</div>
        <div class="value skeleton" id="val-enrolled" style="width:60px;height:2rem;">&nbsp;</div>
        <div class="sub">participants</div>
      </div>
      <div class="card">
        <div class="label">Overall Response Rate</div>
        <div class="value skeleton" id="val-overall-rate" style="width:80px;height:2rem;">&nbsp;</div>
        <div class="sub" id="sub-overall"></div>
      </div>
      <div class="card">
        <div class="label">Follow-up Surveys Sent</div>
        <div class="value skeleton" id="val-scheduled" style="width:70px;height:2rem;">&nbsp;</div>
        <div class="sub" id="sub-scheduled"></div>
      </div>
    </div>

    <p class="section-title">Response Rate by Wave</p>
    <div class="waves" id="wave-cards"></div>

    <p class="meta" id="updated-at"></p>
  </main>

  <script>
    const DATA_URL = "https://storage.googleapis.com/dkg-thesis-dashboard/data.json";

    function pct(rate) {
      return (rate * 100).toFixed(1) + "%";
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = text;
        el.classList.remove("skeleton");
        el.style.width = "";
        el.style.height = "";
      }
    }

    function render(data) {
      setText("val-enrolled", data.enrollment.total.toLocaleString());

      const { scheduled, completed, rate } = data.overall_followup;
      setText("val-overall-rate", pct(rate));
      document.getElementById("sub-overall").textContent =
        completed + " of " + scheduled + " responses";

      setText("val-scheduled", scheduled.toLocaleString());
      document.getElementById("sub-scheduled").textContent =
        data.response_rates.length + " waves tracked";

      const container = document.getElementById("wave-cards");
      container.innerHTML = data.response_rates.map(w => `
        <div class="wave-card">
          <div class="wave-label">${w.label}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct(w.rate)}"></div>
          </div>
          <div class="wave-stats">
            <span>${w.completed} of ${w.scheduled} responded</span>
            <span class="rate">${pct(w.rate)}</span>
          </div>
        </div>
      `).join("");

      const ts = new Date(data.updated_at);
      document.getElementById("updated-at").textContent =
        "Last updated: " + ts.toLocaleString();
    }

    function showError(msg) {
      const el = document.getElementById("error-banner");
      el.textContent = msg;
      el.style.display = "block";
    }

    fetch(DATA_URL)
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(render)
      .catch(err => {
        showError("Could not load study data. It may not be available yet.");
        console.error(err);
      });
  </script>
</body>
</html>
