# ================================================================
# Cloud Run Functions -- Deployment Configuration
# ================================================================
# Single source of truth for all function deploy settings.
# Add new functions as entries under `functions:`.
# ================================================================

global:
  project: dkg-phd-thesis
  region: us-east4
  runtime: python312
  gen2: true

functions:
  run-qualtrics-scheduling:
    source_dir: run_qualtrics_scheduling
    dependency_group: fn-qualtrics-scheduling
    entry_point: qualtrics_webhook_handler
    trigger: http
    allow_unauthenticated: false
    secrets:
      - PHONE_ENCRYPTION_KEY=dkg-phone-encryption-key:1
    service_account:
      name: dkg-fn-qualtrics
      display_name: "Cloud Run -- Qualtrics Scheduling Function"
      roles:
        - roles/bigquery.dataEditor
        - roles/bigquery.jobUser
        - roles/pubsub.publisher
        - roles/secretmanager.secretAccessor

  run-intake-confirmation:
    source_dir: run_intake_confirmation
    dependency_group: fn-intake-confirmation
    entry_point: intake_confirmation_handler
    trigger: topic
    trigger_topic: dkg-intake-processed
    allow_unauthenticated: false
    secrets:
      - TWILIO_CONFIG=dkg-twilio-config:latest
      - PHONE_ENCRYPTION_KEY=dkg-phone-encryption-key:1
    service_account:
      name: dkg-fn-intake-confirm
      display_name: "Cloud Run -- Intake Confirmation Function"
      roles:
        - roles/bigquery.dataEditor
        - roles/bigquery.jobUser
        - roles/pubsub.publisher
        - roles/run.invoker
        - roles/secretmanager.secretAccessor

  run-followup-scheduling:
    source_dir: run_followup_scheduling
    dependency_group: fn-followup-scheduling
    entry_point: followup_scheduling_handler
    trigger: topic
    trigger_topic: dkg-followup-scheduling
    allow_unauthenticated: false
    secrets:
      - TWILIO_CONFIG=dkg-twilio-config:latest
      - PHONE_ENCRYPTION_KEY=dkg-phone-encryption-key:1
    service_account:
      name: dkg-fn-followup-sched
      display_name: "Cloud Run -- Follow-up Scheduling Function"
      roles:
        - roles/bigquery.dataEditor
        - roles/bigquery.jobUser
        - roles/run.invoker
        - roles/secretmanager.secretAccessor

  run-followup-response:
    source_dir: run_followup_response
    dependency_group: fn-followup-response
    entry_point: followup_response_handler
    trigger: http
    allow_unauthenticated: false
    secrets:
      - PHONE_ENCRYPTION_KEY=dkg-phone-encryption-key:1
    service_account:
      name: dkg-fn-followup-resp
      display_name: "Cloud Run -- Follow-up Response Function"
      roles:
        - roles/bigquery.dataEditor
        - roles/bigquery.jobUser
        - roles/secretmanager.secretAccessor

  run-dashboard-export:
    source_dir: run_dashboard_export
    dependency_group: fn-dashboard-export
    entry_point: dashboard_export_handler
    trigger: http
    allow_unauthenticated: false
    secrets:
      - NETLIFY_API_KEY=dkg-netlify-api-key:latest
    service_account:
      name: dkg-fn-dashboard-export
      display_name: "Cloud Run -- Dashboard Export Function"
      roles:
        - roles/bigquery.dataViewer
        - roles/bigquery.jobUser
    # Note: dkg-fn-dashboard-export also requires secret-level access to
    # dkg-netlify-api-key. This is granted via secret IAM binding, not a
    # project role. If redeploying from scratch, run:
    #   gcloud secrets add-iam-policy-binding dkg-netlify-api-key \
    #     --member=serviceAccount:dkg-fn-dashboard-export@dkg-phd-thesis.iam.gserviceaccount.com \
    #     --role=roles/secretmanager.secretAccessor --project=dkg-phd-thesis

  run-connect-scheduling:
    source_dir: run_connect_scheduling
    dependency_group: fn-connect-scheduling
    entry_point: connect_scheduling_handler
    trigger: topic
    trigger_topic: dkg-connect-scheduling
    allow_unauthenticated: false
    secrets:
      - CLOUDRESEARCH_CONNECT_API_KEY=dkg-cloudresearch-connect-api-key:latest
    service_account:
      name: dkg-fn-connect-sched
      display_name: "Cloud Run -- Connect Scheduling Function"
      roles:
        - roles/bigquery.dataEditor
        - roles/bigquery.jobUser
        - roles/run.invoker
        - roles/secretmanager.secretAccessor

  # -- Future functions ----------------------------------------------
  # run-twilio-handler:
  #   source_dir: run_twilio_handler
  #   dependency_group: fn-twilio-handler
  #   entry_point: twilio_webhook_handler
