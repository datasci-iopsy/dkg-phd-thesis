# ================================================================
# GCP, BigQuery, and Storage settings for the dashboard export
# function (run-dashboard-export)
# ================================================================
# Triggered by Cloud Scheduler (hourly). Queries intake enrollment
# and per-wave follow-up response rates, then writes data.json to
# a public Cloud Storage bucket for the Netlify dashboard to fetch.
# ================================================================

gcp:
  project_id: "dkg-phd-thesis"
  location: "US"
  region: "us-east4"

bq:
  dataset_id: "qualtrics"
  tables:
    intake_raw: "stg_intake_responses"
    intake_clean: "int_intake_responses_scored"
    followup_raw: "stg_followup_responses"
    followup_clean: "int_followup_responses_scored"
    scheduled_followups: "scheduled_followups"

netlify:
  site_id: "de1a02c0-802a-4da9-97a0-00131aff6b02"
